<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>NifrAmp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header><h1>NifrAmp</h1><button id="logout" hidden>Log out</button></header>

<form id="login" hidden>
  <input id="user" placeholder="Username" autocomplete="username" required>
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
  <button>Log in</button>
  <p id="err"></p>
</form>

<main id="lib" hidden>
  <nav id="tabs">
    <button data-v="songs">Songs</button>
    <button data-v="album">Albums</button>
    <button data-v="artist">Artists</button>
    <button data-v="genre">Genres</button>
  </nav>
  <div class="bar">
    <input id="filter" placeholder="Search">
    <select id="sort" aria-label="Sort by">
      <option value="title">Title</option>
      <option value="artist">Artist</option>
      <option value="album">Album</option>
      <option value="year">Year</option>
    </select>
  </div>
  <div id="crumb" hidden><button id="back">← Back</button> <span id="gname"></span></div>
  <ul id="songs"></ul>
</main>

<footer id="player" hidden>
  <div id="now"></div>
  <div class="ctl">
    <button id="prev" aria-label="Previous">⏮</button>
    <audio id="audio" controls></audio>
    <button id="next" aria-label="Next">⏭</button>
  </div>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
